<!--
title: 位置 / Placement
description: 对比工具提示在触发器周围支持的位置。 / Compares the supported placement options around the trigger for tooltip.
-->
<div class="rc-demo">
  <rc-tooltip content="Top tip" placement="top">
    <rc-button size="sm" variant="outline">顶部 / Top</rc-button>
  </rc-tooltip>
  <rc-tooltip content="Bottom tip" placement="bottom">
    <rc-button size="sm" variant="outline">底部 / Bottom</rc-button>
  </rc-tooltip>
  <rc-tooltip content="Left tip" placement="left">
    <rc-button size="sm" variant="outline">左侧 / Left</rc-button>
  </rc-tooltip>
  <rc-tooltip content="Right tip" placement="right">
    <rc-button size="sm" variant="outline">右侧 / Right</rc-button>
  </rc-tooltip>
</div>
