<!-- overlay/drawer — basic — usage snippet for @rocketc/web-components -->
<div class="rds-demo">
<rds-button size="sm" variant="outline" onclick="document.getElementById('demo-drawer').show()">
    Open drawer
  </rds-button>
  <rds-drawer id="demo-drawer" side="left">
    <span slot="header">Drawer</span>
    Navigation or filters live here.
    <div slot="footer">
      <rds-button size="sm" onclick="this.closest('rds-drawer').close()">Close</rds-button>
    </div>
  </rds-drawer>
</div>
