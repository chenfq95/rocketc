<!--
title: 状态 / States
description: 对比步骤条支持的主要交互状态。 / Compares the primary interactive states supported by steps.
-->
<div class="rc-demo">
  <rc-steps index="1">
    <rc-step value="plan" state="complete">
      计划 / Plan
      <span slot="description">已完成 / Done</span>
    </rc-step>
    <rc-step value="build" state="active">
      构建 / Build
      <span slot="description">进行中 / In progress</span>
    </rc-step>
    <rc-step value="ship" state="incomplete">
      发布 / Ship
      <span slot="description">下一步 / Next</span>
    </rc-step>
  </rc-steps>
</div>
