<!--
title: 基础 / Basic
description: 展示使用默认配置的实用侧边面板示例。 / Shows a practical sheet example with its default configuration.
-->
<div class="rc-demo">
  <rc-button size="sm" variant="outline" onclick="document.getElementById('demo-sheet').show()">
    打开侧边面板 / Open sheet
  </rc-button>
  <rc-sheet id="demo-sheet" side="right">
    <span slot="header">侧边面板 / Sheet</span>
    用于次要任务的侧边面板。 / Side panel for secondary tasks.
    <div slot="footer">
      <rc-button size="sm" onclick="this.closest('rc-sheet').close()">关闭 / Close</rc-button>
    </div>
  </rc-sheet>
</div>
