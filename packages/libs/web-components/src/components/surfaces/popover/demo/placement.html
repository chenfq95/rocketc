<!--
title: 位置 / Placement
description: 对比弹出框在触发器周围支持的位置。 / Compares the supported placement options around the trigger for popover.
-->
<div class="rc-demo">
  <rc-popover placement="top">
    <rc-button slot="trigger" size="sm" variant="outline">顶部 / Top</rc-button>
    锚定在触发器上方。 / Anchored above the trigger.
  </rc-popover>
  <rc-popover placement="bottom">
    <rc-button slot="trigger" size="sm" variant="outline">底部 / Bottom</rc-button>
    锚定在触发器下方。 / Anchored below the trigger.
  </rc-popover>
  <rc-popover placement="right">
    <rc-button slot="trigger" size="sm" variant="outline">右侧 / Right</rc-button>
    锚定在右侧。 / Anchored to the right.
  </rc-popover>
</div>
