<!--
title: 交互 / Interactive
description: 演示可交互列表项及其操作提示。 / Demonstrates interactive list items and their affordances.
-->
<div class="rc-demo">
  <rc-list bordered>
    <rc-list-item interactive>
      <span slot="prefix">01</span>
      令牌 / Tokens
      <span slot="description">基础 + 语义 / Primitive + semantic</span>
      <rc-badge slot="suffix" variant="success">正常 / ok</rc-badge>
    </rc-list-item>
    <rc-list-item interactive>
      <span slot="prefix">02</span>
      组件 / Components
      <span slot="description">Lit 自定义元素 / Lit custom elements</span>
      <rc-badge slot="suffix">已上线 / live</rc-badge>
    </rc-list-item>
    <rc-list-item disabled>
      适配器 / Adapters
      <span slot="description">即将推出 / Coming soon</span>
    </rc-list-item>
  </rc-list>
</div>
