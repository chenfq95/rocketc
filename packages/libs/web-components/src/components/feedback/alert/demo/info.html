<!--
title: 信息 / Info
description: 展示警告提示的信息样式和内容结构。 / Shows the informational presentation and content structure of alert.
-->
<div class="rc-demo">
  <rc-alert variant="info">
    <span slot="title">提示 / Tip</span>
    优先使用语义令牌，而非硬编码颜色。 / Prefer semantic tokens over hard-coded colors.
  </rc-alert>
  <rc-alert variant="destructive">
    <span slot="title">已阻止 / Blocked</span>
    所选表面的对比度检查失败。 / Contrast check failed for the selected surface.
  </rc-alert>
</div>
