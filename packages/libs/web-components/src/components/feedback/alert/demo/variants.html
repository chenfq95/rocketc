<!--
title: 变体 / Variants
description: 对比警告提示可用的视觉变体和强调级别。 / Compares the visual variants and emphasis levels available to alert.
-->
<div class="rc-demo">
  <rc-alert>
    <span slot="title">默认 / Default</span>
    所选主题的令牌桥接已启用。 / Token bridge is active for the selected theme.
  </rc-alert>
  <rc-alert variant="success">
    <span slot="title">构建完成 / Build complete</span>
    令牌输出已成功生成。 / Token outputs were generated successfully.
  </rc-alert>
  <rc-alert variant="warning">
    <span slot="title">需要审核 / Review needed</span>
    发布前应检查对比度。 / Contrast should be checked before release.
  </rc-alert>
  <rc-alert variant="destructive">
    <span slot="title">失败 / Failed</span>
    无法发布令牌构建。 / The token build could not be published.
  </rc-alert>
</div>
