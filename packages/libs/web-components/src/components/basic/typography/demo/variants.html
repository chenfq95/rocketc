<!--
title: 变体 / Variants
description: 对比排版可用的视觉变体和强调级别。 / Compares the visual variants and emphasis levels available to typography.
-->
<div class="rc-demo">
  <rc-typography variant="display" as="h2">展示文本 / Display</rc-typography>
  <rc-typography variant="title" as="h3">标题 / Title</rc-typography>
  <rc-typography variant="heading" as="h4">标题 / Heading</rc-typography>
  <rc-typography variant="body"
    >正文使用 typography.body 令牌作为默认界面文本。 / Body copy uses typography.body tokens for
    default UI text.</rc-typography
  >
  <rc-typography variant="caption" color="muted">说明 / 元信息 / Caption / meta</rc-typography>
  <rc-typography variant="code">const tokens = true</rc-typography>
</div>
