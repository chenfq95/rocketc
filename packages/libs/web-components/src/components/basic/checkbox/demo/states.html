<div class="rc-demo">
  <rc-checkbox>默认 / Default</rc-checkbox>
  <rc-checkbox checked>已选中 / Checked</rc-checkbox>
  <rc-checkbox indeterminate>不确定状态 / Indeterminate</rc-checkbox>
  <rc-checkbox disabled>已禁用 / Disabled</rc-checkbox>
