<!--
title: 调整尺寸 / Resize
description: 对比文本域支持的尺寸调整行为。 / Compares the resize behaviors supported by textarea.
-->
<div class="rc-demo">
  <rc-textarea
    rows="3"
    placeholder="垂直调整尺寸 / Vertical resize"
    resize="vertical"
  ></rc-textarea>
  <rc-textarea rows="3" placeholder="禁止调整尺寸 / No resize" resize="none"></rc-textarea>
  <rc-textarea rows="2" readonly>只读备注 / Readonly notes</rc-textarea>
</div>
