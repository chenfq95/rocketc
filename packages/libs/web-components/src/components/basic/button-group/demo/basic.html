<!--
title: 基础 / Basic
description: 将相关操作贴合为一组分段控件；请提供 aria-label。 / Attaches related actions into one segmented control; provide an aria-label.
-->
<div class="rc-demo">
  <rc-button-group aria-label="文本对齐 / Text alignment">
    <rc-button variant="outline">左 / Left</rc-button>
    <rc-button variant="outline">中 / Center</rc-button>
    <rc-button variant="outline">右 / Right</rc-button>
  </rc-button-group>
  <rc-button-group aria-label="编辑 / Edit">
    <rc-button variant="subtle">剪切 / Cut</rc-button>
    <rc-button variant="subtle">复制 / Copy</rc-button>
    <rc-button variant="subtle">粘贴 / Paste</rc-button>
  </rc-button-group>
</div>
