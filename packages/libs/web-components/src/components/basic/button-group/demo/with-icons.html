<!--
title: 图标按钮 / With icon buttons
description: 可与 rc-icon-button 组合用于紧凑工具栏。 / Combines with rc-icon-button for compact toolbars.
-->
<div class="rc-demo">
  <rc-button-group aria-label="视图 / View">
    <rc-icon-button variant="outline" aria-label="列表 / List">
      <i data-lucide="list"></i>
    </rc-icon-button>
    <rc-icon-button variant="outline" aria-label="网格 / Grid">
      <i data-lucide="layout-grid"></i>
    </rc-icon-button>
    <rc-icon-button variant="outline" aria-label="设置 / Settings">
      <i data-lucide="settings"></i>
    </rc-icon-button>
  </rc-button-group>
</div>
