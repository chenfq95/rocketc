<!--
title: 分隔 / Separated
description: 使用 separated 时按钮以间距分开排列，不再贴合。 / With separated, buttons keep spacing instead of attaching.
-->
<div class="rc-demo">
  <rc-button-group separated aria-label="表单操作 / Form actions">
    <rc-button variant="solid">保存 / Save</rc-button>
    <rc-button variant="outline">取消 / Cancel</rc-button>
  </rc-button-group>
</div>
