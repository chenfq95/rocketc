<!--
title: 垂直排列 / Vertical
description: 展示便于浏览的垂直排列单选框。 / Shows radio arranged vertically for easier scanning.
-->
<div class="rc-demo">
  <rc-radio-group name="theme" value="light" orientation="vertical">
    <span slot="label">主题 / Theme</span>
    <rc-radio value="light">浅色 / Light</rc-radio>
    <rc-radio value="dark">深色 / Dark</rc-radio>
  </rc-radio-group>
</div>
