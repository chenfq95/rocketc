<!-- basic/select — states — usage snippet for @rocketc/web-components -->
<div class="rds-demo">
<rds-select value="light">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </rds-select>
  <rds-select value="light" disabled>
    <option value="light">Disabled</option>
  </rds-select>
  <rds-select multiple size="3">
    <option value="tokens" selected>Tokens</option>
    <option value="components" selected>Components</option>
    <option value="adapters">Adapters</option>
  </rds-select>
</div>
