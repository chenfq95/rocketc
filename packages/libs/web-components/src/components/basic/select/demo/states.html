<!--
title: 状态 / States
description: 对比选择器支持的主要交互状态。 / Compares the primary interactive states supported by select.
-->
<div class="rc-demo">
  <rc-select value="light">
    <option value="light">浅色 / Light</option>
    <option value="dark">深色 / Dark</option>
  </rc-select>
  <rc-select value="light" disabled>
    <option value="light">已禁用 / Disabled</option>
  </rc-select>
  <rc-select multiple size="3">
    <option value="tokens" selected>令牌 / Tokens</option>
    <option value="components" selected>组件 / Components</option>
    <option value="adapters">适配器 / Adapters</option>
  </rc-select>
</div>
